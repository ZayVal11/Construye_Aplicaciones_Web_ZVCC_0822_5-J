<!DOCTYPE html> <!-- Es una declaracion obligatoria al inicio de cada html -->
<html lang="en"> <!-- Esta declarando el idioma -->

<head> <!-- Es el encabezado que contiene metadatos -->
  <meta charset="UTF-8"> <!-- Metadato que va a permitir el uso de caracteres -->
  <meta name="viewport" content="width=device=width,  initial-scale=1.0"> <!-- Indica tamaño y dimensiones de la pagina -->
  <title>Parrafos HTML</title> <!-- Este sera el nombre del html -->
</head> <!-- Finaliza el encabezado que tiene los metadatos -->

<body> <!-- Contenedor de todo lo visible en el html -->
  <h1>Estructura del HTML</h1> <!-- Encabezado mas grande, sirven para encabezados o titulos -->
  <h2>HTML</h2> <!-- otro encabezado, el siguiete despues de h1 -->
  <p>Envuelve todo el contenido de la pagina</p> <!-- Parrafos, esta poniendo un escrito de para que sirven algunas etiquetas -->
  <h2>Head</h2> <!-- Le esta dando un titulo -->
  <p>Contiene los metadatos del sitio web, configuraciones y el titulo de la pestaña</p> <!-- Escrito de la fucion de otra etiqueta -->
  <h2>Body</h2> <!-- Encabezado del Body dando a entender que se hablara de este -->
  <p>Muestra la informacion del autor de la pagina, creditos informacion relevante, etc.</p> <!-- Nuestra la informacion del body y su funcion  -->
</body> <!-- Esta finalizando el cuerpo del html  -->
</html> <!-- Finaliza el html -->
