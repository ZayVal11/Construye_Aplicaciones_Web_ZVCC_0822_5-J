<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title> Practica_Atributos </title>
	<!-- Importamos una fuente estilo manuscrita idéntica a la de la imagen -->
	<link rel="preconnect" href="https://googleapis.com">
	<link rel="preconnect" href="https://gstatic.com" crossorigin>
	<link href="https://googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
</head>
<body>

	<!-- Contenedor principal con posición relativa para controlar las coordenadas del texto -->
	<div style="font-family: 'Arial Black', Impact, sans-serif; color: #002d62; margin: 30px; position: relative; width: 600px; height: 160px;">
		
		<!-- TÍTULO PRINCIPAL -->
		<div style="line-height: 1;">
			<!-- "Semáforo" usa una fuente sans-serif limpia pero gruesa -->
			<span style="font-family: Arial, Helvetica, sans-serif; font-size: 52px; font-weight: bold; letter-spacing: -2px; color: #002d62; vertical-align: bottom;">Semáforo</span>
			
			<!-- "TRIAGE" en itálica/cursiva, súper gigante y condensada -->
			<span style="font-size: 85px; font-style: italic; font-weight: 900; letter-spacing: -4px; color: #002d62; vertical-align: bottom; margin-left: 15px;">TRIAGE</span>
		</div>

		<!-- SUBTÍTULO IZQUIERDO: medicina para medicos -->
		<div style="font-family: 'Caveat', cursive; font-size: 24px; color: #557a95; position: absolute; left: 5px; top: 105px; letter-spacing: 0px;">
			medicina para medicos
		</div>

		<!-- SUBTÍTULO DERECHO: urgencias -->
		<div style="font-family: 'Caveat', cursive; font-size: 32px; color: #3a6073; position: absolute; left: 410px; top: 95px; letter-spacing: 1px;">
			urgencias
		</div>
		
	</div>

</body>
</html>
