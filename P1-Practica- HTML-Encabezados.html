<!DOCTYPE html> <!-- Etiqueta siempre necesaria para identificar el html -->
<html lang="en"> <!-- Determina el lenguaje -->

<head> <!-- Encabezado de los metadatos -->
  <meta charset="UTF-8"> <!-- Define matadatos que aceptan caracteres como ñ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Metadatos de vista y de la pantalla -->
  <title>Encabezados HTML</title> <!-- Titulo del hatml -->
</head> <!-- Finaliza el encabezado head -->

<body> <!-- Etiqueta donde se contienen todos los elementos que seran visuales -->
  <h1>Titulo 1</h1> <!-- Encabezado mas grande e importante -->
  <h2>Titulo 2</h2> <!-- El siguiente titulo un poco mas pequeño -->
  <h3>Titulo 3</h3> <!-- Encabezado algo importante -->
  <h4>Titulo 4</h4> <!-- Encabezado poco relevante -->
  <h5>Titulo 5</h5> <!-- Titulo muy poco importante -->
  <h6>Titulo 6</h6> <!-- Titulo no relevante -->
</body> <!-- Cierra el contenido visual -->

</html> <!-- Finaliza el html -->
