<!DOCTYPE html> <!-- Castro Chairez Zulay Valentina | 5°J | 0822 | Programación -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title> <!-- <title>: Define el título de la página que se muestra en la pestaña del navegador -->
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- <link>: Vincula recursos externos -->
</head>

    <h2>Formularios con agrupamiento</h2>
    <form action="" method="post">  <!-- <form>: Agrupa controles de entrada. action=ruta de envío, method=método HTTP (post/get) -->
        <fieldset> <!-- <fieldset>: Agrupa visualmente secciones del formulario en un recuadro -->
            <legend>Datos personales</legend> <!-- <legend>: Define el título visual del <fieldset> -->
            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br>
            Documento valido:
            <input type="file" name="documento"><br>
            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento"> <!-- type="date": Entrada con selector desplegable de calendario -->
        </fieldset>

        <fieldset>
            <legend>Datos de estudio:</legend>
            Nombre de la escuela:
            <input type="text" name="escuela"><br>
            Certificado valido:
            <input type="file" name="certificado"><br>
            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset>
        <br>
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
</body>
</html>
