<!DOCTYPE html> <!-- Castro Chairez Zulay Valentina | 5°J | 0822 | Programación -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title> <!-- <title>: Define el título de la página que se muestra en la pestaña del navegador -->
    <!-- Libreria de iconos en linea -->
</head>
 
   <h1>Formularios con checkbox</h1>
    <form action="" method="post"> <!-- <form>: Agrupa controles de entrada. action=ruta de envío, method=método HTTP (post/get) -->
        Ingresa tu nombre:
        <input type="text" name="nombre"> <!--cuadro de entrada donde el usuario puede escribir texto plano-->
        <br>
        Selecciona los lenguajes que conozcas:
        <br>
        <input type="checkbox" name="Java">Java <br> <!-- type="checkbox": Casilla de verificación para selección múltiple -->
        <input type="checkbox" name="Python"> Python <br>
        <input type="checkbox" name="C#">C# <br>
        <input type="checkbox" name="Flutter"> Flutter <br>
    </form>
</body>
</html>
